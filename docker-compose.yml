services:
  heizung:
    image: ghcr.io/l480/vaillant-ui:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      EBUSD_ADDR: host.docker.internal:8888
      # ALLOWED_HOSTS: heizung.example.org
      # READONLY: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
